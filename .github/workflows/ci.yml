name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (from scratch)
        run: |
          make clean
          make build

      - name: C test suites
        run: make test

      - name: Install Python tooling deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: LIS Inspect tests
        run: PYTHONPATH=tools python -m unittest discover -s tools/tests -t . -v
