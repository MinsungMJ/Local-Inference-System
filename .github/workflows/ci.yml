name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (from scratch)
        run: |
          make clean
          make build

      - name: C test suites
        run: make test

      - name: Install Python tooling deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Install and run model-free LIS Verify demo
        run: |
          python -m pip install --no-deps .
          set +e
          lis-verify demo --out "$RUNNER_TEMP/lis-verify-demo"
          demo_status=$?
          set -e
          test "$demo_status" -eq 4
          DEMO_ROOT="$RUNNER_TEMP/lis-verify-demo" python - <<'PY'
          import os
          from pathlib import Path
          from lis_verify.report_artifact import load_report

          attempts = sorted(Path(os.environ["DEMO_ROOT"]).glob("attempt-*"))
          assert len(attempts) == 1
          report = load_report(attempts[0] / "verification_report.json")
          assert report.verdict.value == "REGRESSION"
          assert not (attempts[0] / "runtime").exists()
          PY

      - name: LIS Inspect tests
        run: PYTHONPATH=tools python -m unittest discover -s tools/tests -t . -v
