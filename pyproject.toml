[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lis-verify"
dynamic = ["version"]
description = "Offline verification tooling for the Local Inference System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inspect = ["textual>=0.60"]

[project.scripts]
lis-verify = "lis_verify.cli:main"
lis-inspect = "lis_inspect.cli:main"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["lis_verify*", "lis_inspect*"]

[tool.setuptools.package-data]
"lis_verify.demo_data" = ["*.json"]
"lis_verify.golden_models" = ["*.json"]
"lis_verify.model_profiles" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "lis_verify.__version__"}
